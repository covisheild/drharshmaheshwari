    <circle cx="304" cy="216" r="1.6" fill="#2b2a33"/><circle cx="316" cy="216" r="1.6" fill="#2b2a33"/>
    <path d="M302 230 Q310 222 318 230"/>
    <path d="M310 238 L310 300 M310 255 L260 268 M310 255 L336 282 M310 300 L294 345 M310 300 L326 345"/>
    <circle cx="288" cy="192" r="4"/><circle cx="276" cy="174" r="7"/>
    <path d="M248 135 q-18 -30 12 -42 q14 -26 44 -10 q30 -8 36 20 q22 18 -4 38 q-10 18 -38 10 q-30 12 -50 -16 z" fill="#fff"/>
    <path d="M276 124 q-12 0 -10 -12 q2 -10 14 -8 q6 -12 20 -6 q12 0 12 12 q10 2 6 14 z" fill="#d6dbe3"/>
    <path d="M280 132 l-3 9 M292 132 l-3 9 M304 132 l-3 9" stroke="#5b8bd0"/>

