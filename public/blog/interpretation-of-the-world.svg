    <path d="M854 334 L854 236 L878 236 L878 334" fill="#e8e2d6"/>
    <circle cx="873" cy="288" r="2" fill="#2b2a33"/>
    <path d="M930 334 L1186 334" stroke="#8a8478"/>
    <path d="M944 334 L944 260 Q961 238 978 260 L978 334" fill="#fff"/>
    <path d="M992 334 L992 246 L1028 246 L1028 334" fill="#fff"/>
    <path d="M1028 246 L1044 256 L1044 330 L1028 334 Z" fill="#fff"/>
