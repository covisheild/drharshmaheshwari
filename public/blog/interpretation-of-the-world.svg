    <circle cx="1160" cy="252" r="13"/>
    <circle cx="1155" cy="249" r="1.4" fill="#2b2a33"/><circle cx="1165" cy="249" r="1.4" fill="#2b2a33"/>
    <path d="M1154 256 Q1160 262 1166 256"/>
    <path d="M1160 265 L1160 304 M1160 274 L1142 256 M1160 274 L1178 256 M1160 304 L1150 333 M1160 304 L1170 333"/>
  </g>

  <g font-family="'Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="20" fill="#2b2a33" text-anchor="middle">
    <text x="200" y="400">same glass, two stories</text>
    <text x="600" y="400">see → feel → act → become</text>
    <text x="1000" y="400">more doors than before</text>
    <text x="866" y="226" font-size="15" fill="#6b655a">then</text>
    <text x="1040" y="230" font-size="15" fill="#6b655a">now</text>
  </g>
</svg>
